name: Keep the API awake

# Render's free plan puts the server to sleep after 15 minutes without traffic,
# so the next visitor waits 30-60 seconds. This pings the health check every
# 10 minutes from 8 am to midnight India time (02:30-18:30 UTC).
# Off overnight on purpose: Render gives 750 free hours a month per workspace,
# shared by all free services, and running 24/7 would use almost all of them.
on:
  schedule:
    - cron: "*/10 3-18 * * *"
    - cron: "30,40,50 2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping the health check
        run: |
          curl --silent --show-error --fail --max-time 90 --retry 2 --retry-delay 15 \
            https://study-notion-project-1-px3q.onrender.com/api/v1/health
