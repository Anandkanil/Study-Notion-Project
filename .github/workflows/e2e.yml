name: Browser tests

# Builds the site and runs the Playwright smoke tests in e2e/ on every pull request.
# The API is replaced by fixtures, so these don't depend on the live server.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund @playwright/test@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          REACT_APP_BASEURL: https://api.example.test/api/v1
      - run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
